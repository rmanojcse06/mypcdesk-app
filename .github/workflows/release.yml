name: Release

# Push a tag like v1.0.0-beta.1 and this builds the Windows installer + portable zip
# and attaches them to a GitHub Release (marked pre-release when the tag has a "-").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke tests
        run: python -m unittest discover tests -v
      - name: Read version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "MYDESK_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Bundle with PyInstaller
        run: pyinstaller packaging/mydesk.spec --noconfirm
      - name: Check the bundle starts and can run a tool
        shell: pwsh
        run: |
          & dist\MyDesk\MyDesk-tool.exe --version
          & dist\MyDesk\MyDesk-tool.exe --run-script dist\MyDesk\_internal\tools\mycheats\mycheats.py
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer.iss
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\MyDesk\* -DestinationPath "dist\MyDesk-$env:MYDESK_VERSION-portable.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MyDesk ${{ env.MYDESK_VERSION }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: CHANGELOG.md
          files: |
            dist/MyDesk-Setup-*.exe
            dist/MyDesk-*-portable.zip
