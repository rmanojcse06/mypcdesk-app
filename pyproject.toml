[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mydesk"
dynamic = ["version"]
description = "A colourful personal desktop app that holds all your own tools: health monitor, Clip Maker, MyCheats, calendar, remote control from your phone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Manoj" }]
keywords = ["desktop", "dashboard", "tools", "system-monitor", "productivity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "pywebview>=5.0",
  "psutil>=5.9",
  "markdown>=3.5",
  "pystray>=0.19",
  "Pillow>=10",
  "pycaw; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Clip Maker: video download, screenshots and OCR (~300 MB). `pipx install "mydesk[clip]"`
clip = ["yt-dlp", "imageio-ffmpeg", "rapidocr>=2.0", "onnxruntime"]
# Linux window engine (optional; without it MyDesk opens in a Chrome/Edge app window)
qt = ["pywebview[qt]"]
all = ["mydesk[clip]"]

[project.scripts]
mydesk = "mydesk.cli:main"

[project.gui-scripts]
# Same as `mydesk`, but on Windows it starts without a console window (used for shortcuts / sign-in)
mydesk-app = "mydesk.cli:main"

[project.urls]
Homepage = "https://github.com/rmanojcse06/MyDesk"

[tool.setuptools.dynamic]
version = { file = "mydesk/VERSION" }

[tool.setuptools.packages.find]
include = ["mydesk", "mydesk.*"]

[tool.setuptools.package-data]
mydesk = ["VERSION", "sections.json", "config.example.json", "ui/*", "tools/**/*"]
