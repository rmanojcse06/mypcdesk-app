<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDesk Lobby Design</title>
<!-- Design mockup of the three-panel lobby. Open with #lobby, #health, #claude, #tokens, #max or #tips-edit. Sample data only. -->
<style>
:root {
  --paper: #fbf6ec; --card: #fff; --ink: #1d2233; --ink-2: #565d73; --ink-3: #8a90a3; --line: #e7e1d4;
  --blue: #2f6fed; --green: #0e9f6e; --pink: #e3487a; --violet: #7b4fe0; --amber: #e8890c; --red: #e5484d;
  --cyan: #0aa5b8; --slate: #4b5876; --clay: #d97757;
  --serif: Cambria, Georgia, "DejaVu Serif", serif; --sans: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; height: 100vh; overflow: hidden; color: var(--ink); font: 14px/1.45 var(--sans);
  background: var(--paper) radial-gradient(rgba(29,34,51,.07) 1px, transparent 1px) 0 0 / 18px 18px;
}
.app { height: 100vh; display: grid; grid-template-rows: auto auto 1fr; gap: 14px; padding: 16px 22px 18px; }

/* header */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-bottom: 10px; border-bottom: 2.5px solid var(--ink); }
.hello { font: 600 22px/1.15 var(--serif); }
.hello span { display: block; font-weight: 400; font-size: 16px; color: var(--ink-2); }
.hello b { text-decoration: underline 3px var(--pink); text-underline-offset: 4px; }
.brand { margin: 0; font: 700 34px/1 var(--serif); }
.who { justify-self: end; display: flex; gap: 14px; align-items: center; text-align: right; }
.who .t { font: 600 18px var(--sans); } .who .d { font-size: 12.5px; color: var(--ink-2); }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 20px var(--serif);
  border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  background: conic-gradient(var(--blue), var(--violet), var(--pink), var(--amber), var(--green), var(--blue)); }

/* panels */
.panels { min-height: 0; display: grid; gap: 14px; transition: grid-template-rows .3s; }
.panel { position: relative; min-height: 0; display: flex; flex-direction: column; background: var(--card);
  border: 2px solid var(--ink); border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); overflow: hidden; }
.ph { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 16px; border-bottom: 2px solid var(--ink);
  background: color-mix(in srgb, var(--pc) 10%, #fff); }
.ph .badge { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--pc); color: #fff;
  border: 1.75px solid var(--ink); font: 700 13px var(--serif); }
.ph h2 { margin: 0; font: 700 17px var(--serif); }
.ph .meta { color: var(--ink-3); font-size: 12px; }
.ph .acts { margin-left: auto; display: flex; gap: 6px; }
.ib { width: 30px; height: 30px; display: grid; place-items: center; border: 1.75px solid var(--ink); border-radius: 8px; background: #fff;
  box-shadow: 1.5px 1.5px 0 var(--ink); cursor: pointer; }
.ib svg { width: 15px; height: 15px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ib.hint { outline: 3px solid color-mix(in srgb, var(--pc) 45%, transparent); outline-offset: 2px; }
.pb { flex: 1; min-height: 0; padding: 14px 18px; overflow: hidden; }
.panel.collapsed .pb { padding: 0 16px; display: flex; align-items: center; gap: 10px; overflow: hidden; }
.panel.collapsed .ph { border-bottom: none; }
.panel.collapsed { flex-direction: row; }
.panel.collapsed .ph { flex: none; background: none; padding-right: 8px; }
.panel.collapsed .acts { order: 9; margin-left: 0; padding-right: 10px; align-self: center; }
.panel.hidden { display: none; }
/* expanded / maximized panels scroll inside themselves */
.panel.scroll .pb { overflow-y: auto; scrollbar-gutter: stable; }
.panel.scroll .msgs, .panel.scroll .side { overflow-y: auto; scrollbar-gutter: stable; padding-right: 6px; }
.pb::-webkit-scrollbar, .msgs::-webkit-scrollbar, .side::-webkit-scrollbar { width: 12px; }
.pb::-webkit-scrollbar-track, .msgs::-webkit-scrollbar-track, .side::-webkit-scrollbar-track { background: #f3efe5; border-radius: 10px; }
.pb::-webkit-scrollbar-thumb, .msgs::-webkit-scrollbar-thumb, .side::-webkit-scrollbar-thumb { background: var(--pc, #8a90a3); border: 2px solid #f3efe5; border-radius: 10px; }
.scroll-hint { position: absolute; right: 34px; bottom: 12px; z-index: 3; font: 700 11.5px var(--sans); color: #fff; background: var(--ink); padding: 4px 10px; border-radius: 99px; box-shadow: 2px 2px 0 rgba(0,0,0,.15); }

/* health */
.gauges { display: grid; grid-template-columns: repeat(3, 1fr) 1.3fr; gap: 16px; align-items: center; }
.g { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; }
.g.sel { border-color: var(--ink); background: color-mix(in srgb, var(--gc) 10%, #fff); box-shadow: 2px 2px 0 var(--ink); }
.g svg { width: 58px; height: 58px; transform: rotate(-90deg); flex: none; }
.g circle { fill: none; stroke-width: 6; }
.g b { display: block; font: 700 23px/1 var(--sans); } .g span { font: 600 14px var(--serif); } .g small { display: block; font-size: 11.5px; color: var(--ink-3); }
.facts { display: grid; gap: 3px; padding-left: 16px; border-left: 2px dashed var(--line); font-size: 13px; }
.facts div { display: flex; gap: 8px; } .facts span { color: var(--ink-2); min-width: 84px; }
.inds { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 12px; padding-top: 11px; border-top: 2px dashed var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1.75px solid var(--ink); border-radius: 999px;
  background: #fff; font: 600 12px var(--sans); white-space: nowrap; cursor: pointer; }
.chip small { color: var(--ink-3); font-weight: 500; }
.chip .bar { width: 42px; height: 7px; border: 1.25px solid var(--ink); border-radius: 9px; background: #f1ece1; overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--amber); }
.chip.usb { background: color-mix(in srgb, var(--cyan) 14%, #fff); border-color: var(--cyan); }
.chip.usb .bar i { background: var(--cyan); }
.chip.green { background: color-mix(in srgb, var(--green) 14%, #fff); border-color: var(--green); }
.tagx { font: 800 9.5px var(--sans); color: #fff; background: var(--cyan); border-radius: 4px; padding: 1px 4px; }
.key { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1.75px solid var(--ink); border-radius: 7px;
  box-shadow: 0 2px 0 var(--ink); background: #fff; font: 700 11.5px var(--sans); color: var(--ink-3); }
.key::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #d9d3c5; }
.key.lit { color: var(--ink); background: #fffbe6; } .key.lit::before { background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
.keys { margin-left: auto; display: flex; gap: 7px; }

/* tools */
.toolgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.sec { border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--sc) 7%, #fff); }
.sec h3 { margin: 0 0 7px; display: flex; align-items: center; gap: 8px; font: 700 14.5px var(--serif); }
.sec h3 i { width: 11px; height: 11px; border-radius: 4px; background: var(--sc); border: 1.5px solid var(--ink); }
.sec h3 small { margin-left: auto; font: 600 11px var(--sans); color: var(--ink-3); }
.sec a { display: block; padding: 2px 0; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; font: 500 13.5px var(--serif); }
.sec a.soon { color: var(--ink-3); text-decoration: none; font-style: italic; }
.sec a.soon::after { content: " · soon"; font: 500 10.5px var(--sans); }
.star { color: var(--amber); text-decoration: none !important; }

/* collapsed strips */
.strip-label { font: 700 11px var(--sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
.note { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; border: 1.75px solid var(--ink);
  background: #fff; font: 500 12.5px var(--sans); white-space: nowrap; }
.note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--nc, var(--red)); }
.note time { color: var(--ink-3); font-size: 11.5px; }
.fav { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 9px; border: 1.75px solid var(--ink);
  background: color-mix(in srgb, var(--sc) 14%, #fff); box-shadow: 1.5px 1.5px 0 var(--ink); font: 700 12.5px var(--serif); white-space: nowrap; }
.fav i { width: 9px; height: 9px; border-radius: 3px; background: var(--sc); border: 1.25px solid var(--ink); }
.vr { width: 2px; align-self: stretch; margin: 10px 4px; background: var(--line); }
.mini { display: inline-flex; gap: 5px; align-items: baseline; font: 600 12.5px var(--sans); white-space: nowrap; }
.mini b { font-size: 15px; }
.mini-ring { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), #e7e1d4 0); align-self: center; }

/* claude */
.prompt { display: flex; gap: 12px; align-items: center; }
.prompt .in { flex: 1; padding: 11px 14px; border: 2.5px solid var(--ink); border-radius: 11px; background: #fffdf8; font: 400 16px var(--serif); color: var(--ink-3); }
.btn { padding: 10px 18px; border: 2px solid var(--ink); border-radius: 10px; background: var(--clay); color: #fff; font-weight: 700; box-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
.btn.ghost { background: #fff; color: var(--ink); }
.usage { display: grid; grid-template-columns: repeat(4, 1fr) 1.25fr; gap: 10px; margin-bottom: 12px; }
.stat { position: relative; padding: 9px 12px; border: 2px solid var(--ink); border-radius: 12px; background: #fff; cursor: pointer; }
.stat.sel { background: color-mix(in srgb, var(--clay) 12%, #fff); box-shadow: 2px 2px 0 var(--ink); }
.stat .k { font: 700 10.5px var(--sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: .5px; }
.stat .v { font: 700 21px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.stat .c { font: 600 12.5px var(--sans); color: var(--green); }
.stat .c small { color: var(--ink-3); font-weight: 500; }
.stat .info { position: absolute; top: 8px; right: 9px; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink-3);
  font: 700 10px/13px var(--sans); text-align: center; color: var(--ink-3); }
.bill { padding: 9px 12px; border: 2px solid var(--ink); border-radius: 12px; background: color-mix(in srgb, var(--clay) 9%, #fff); }
.bill .row { display: flex; justify-content: space-between; align-items: baseline; }
.bill .v { font: 700 21px/1.15 var(--sans); }
.meter { height: 10px; border: 1.5px solid var(--ink); border-radius: 9px; background: #f1ece1; overflow: hidden; margin: 6px 0 4px; }
.meter i { display: block; height: 100%; background: var(--clay); }
.bill small { color: var(--ink-3); font-size: 11.5px; }
.stat-k { font: 700 10.5px var(--sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: .5px; }

.cl-grid { display: grid; grid-template-columns: 1fr 470px; gap: 16px; height: 100%; min-height: 0; }
.chat { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.msgs { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.m { max-width: 82%; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 14px; font-size: 13.5px; }
.m.u { align-self: flex-end; background: #eef3ff; border-bottom-right-radius: 4px; }
.m.a { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; }
.m .tk { display: block; margin-top: 5px; font: 600 11px var(--sans); color: var(--ink-3); }
.m ul { margin: 6px 0 0; padding-left: 18px; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.card { border: 2px solid var(--ink); border-radius: 12px; padding: 11px 14px; background: #fff; }
.card h4 { margin: 0 0 8px; font: 700 14px var(--serif); display: flex; align-items: center; }
.card h4 small { margin-left: auto; font: 500 11.5px var(--sans); color: var(--ink-3); }
.s4 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.chart svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-2); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--ink); }

/* token meta popover */
.pop { position: absolute; z-index: 5; width: 430px; padding: 14px 16px; background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink); }
.pop::before { content: ""; position: absolute; top: -9px; left: var(--ax, 46px); width: 14px; height: 14px; background: #fff; border-left: 2.5px solid var(--ink); border-top: 2.5px solid var(--ink); transform: rotate(45deg); }
.pop h4 { margin: 0 0 2px; font: 700 16px var(--serif); display: flex; }
.pop h4 small { margin-left: auto; font: 500 12px var(--sans); color: var(--ink-3); }
.pop .sub { color: var(--ink-3); font-size: 12px; margin-bottom: 10px; }
.pop table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pop td, .pop th { padding: 5px 4px; border-top: 1px solid var(--line); text-align: left; }
.pop th { font: 700 10.5px var(--sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: .4px; border-top: none; }
.pop td.n, .pop th.n { text-align: right; font-variant-numeric: tabular-nums; }
.pop tr.tot td { font-weight: 700; border-top: 2px solid var(--ink); }
.split { display: flex; height: 14px; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; margin: 6px 0 4px; }
.split i { display: block; height: 100%; }

/* health detail */
.hd { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; margin-top: 14px; }
.drv { display: grid; grid-template-columns: 92px 1fr 150px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.drv:first-of-type { border-top: none; }
.drv b { font-size: 14px; } .drv small { color: var(--ink-3); display: block; font-size: 11.5px; }
.drv .big { height: 12px; border: 1.5px solid var(--ink); border-radius: 9px; background: #f1ece1; overflow: hidden; }
.drv .big i { display: block; height: 100%; background: var(--amber); }
.ev { display: grid; grid-template-columns: 52px 18px 1fr; gap: 6px; padding: 4px 0; font-size: 13px; align-items: center; }
.ev time { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12px; }
.ev .d { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--ec); }
.devs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; }
.devs div { display: flex; gap: 8px; align-items: center; }
.devs small { color: var(--ink-3); margin-left: auto; }
.cores { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; height: 86px; align-items: end; }
.cores div { position: relative; height: 100%; border: 1.5px solid var(--ink); border-radius: 6px; background: #f1ece1; overflow: hidden; }
.cores i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--blue); }
.procs { width: 100%; border-collapse: collapse; font-size: 13px; }
.procs td, .procs th { padding: 5px 6px; border-top: 1px solid var(--line); text-align: left; }
.procs th { border-top: none; font: 700 10.5px var(--sans); color: var(--ink-3); text-transform: uppercase; }
.procs .n { text-align: right; font-variant-numeric: tabular-nums; }

.callout { position: absolute; z-index: 9; background: var(--ink); color: #fff; font: 600 12px var(--sans); padding: 5px 10px; border-radius: 8px; white-space: nowrap; }
.callout::after { content: ""; position: absolute; width: 8px; height: 8px; background: var(--ink); transform: rotate(45deg); }
.callout.down::after { left: 18px; bottom: -4px; } .callout.up::after { left: 18px; top: -4px; } .callout.right::after { right: -4px; top: 9px; }

/* tips strip (vertical marquee) */
.tips { position: relative; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 8px 0 14px;
  background: #fffbe6; border: 2px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); }
.tips .lbl { display: flex; align-items: center; gap: 7px; font: 700 14px var(--serif); white-space: nowrap; padding-right: 12px; border-right: 2px dashed #e6d9a8; }
.tips .win { flex: 1; height: 42px; overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); }
.tips .track { transition: transform .7s cubic-bezier(.3,.7,.2,1); }
.tip { height: 42px; display: flex; align-items: center; gap: 10px; font-size: 14px; white-space: nowrap; }
.tip .tag { font: 700 10.5px var(--sans); padding: 2px 8px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--tc); color: #fff; }
.tip .pin { color: var(--amber); }
.tips .pos { font: 600 11.5px var(--sans); color: var(--ink-3); white-space: nowrap; }
.tips .ib { width: 28px; height: 28px; }
.tips .ib svg { width: 13px; height: 13px; }
.tip-edit { position: absolute; left: 140px; top: 52px; z-index: 8; width: 720px; padding: 14px 16px; background: #fff;
  border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink); }
.tip-edit h4 { margin: 0 0 8px; font: 700 16px var(--serif); display: flex; align-items: center; }
.tip-edit h4 small { margin-left: auto; font: 500 12px var(--sans); color: var(--ink-3); }
.te-row { display: grid; grid-template-columns: 18px 1fr 110px 28px 28px; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); }
.te-row .grip { color: var(--ink-3); cursor: grab; text-align: center; }
.te-row .txt { padding: 6px 10px; border: 1.75px solid var(--ink); border-radius: 8px; background: #fffdf8; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.te-row .txt.editing { outline: 3px solid color-mix(in srgb, var(--amber) 40%, transparent); }
.te-row select, .te-row .sel, .te-add .sel { padding: 5px 8px; border: 1.75px solid var(--ink); border-radius: 8px; font: 600 12px var(--sans); background: #fff; }
.te-row .ic2 { text-align: center; font-size: 15px; color: var(--ink-3); }
.te-row .ic2 { opacity: .28; filter: grayscale(1); }
.te-row .ic2.on { opacity: 1; filter: none; }
.te-add { display: grid; grid-template-columns: 1fr 110px auto; gap: 8px; margin-top: 10px; }
.te-add .txt { padding: 8px 10px; border: 2px dashed var(--ink-3); border-radius: 8px; color: var(--ink-3); font-size: 13.5px; }
.te-foot { display: flex; gap: 18px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 2px dashed var(--line); font-size: 12.5px; color: var(--ink-2); }
.te-foot b { color: var(--ink); }
.te-foot .btn { margin-left: auto; padding: 7px 16px; background: var(--amber); }
/* header buttons (match the app) */
.hdr-btns { display: flex; gap: 10px; align-items: center; }
.hb { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 12px; background: #fff; box-shadow: 2px 2px 0 var(--ink); }
.hb svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hb .nb { position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; border: 2px solid var(--ink); border-radius: 99px; background: var(--red); color: #fff; font: 800 11px/16px var(--sans); text-align: center; }
.hb .nb.amber { background: var(--amber); }
.dlgc { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 2px solid var(--violet); border-radius: 99px; background: color-mix(in srgb, var(--violet) 14%, #fff); box-shadow: 2px 2px 0 var(--ink); font: 700 14px var(--sans); color: var(--violet); }
.dlgc small { color: var(--ink-3); font-size: 11.5px; }
.sample { position: fixed; right: 26px; bottom: 6px; font: 600 10.5px var(--sans); color: var(--ink-3); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hello"><span>Hello</span><b>Manoj</b>,</div>
    <h1 class="brand"><span style="color:var(--blue)">M</span><span style="color:var(--pink)">y</span><span style="color:var(--green)">D</span><span style="color:var(--amber)">e</span><span style="color:var(--violet)">s</span><span style="color:var(--red)">k</span></h1>
    <div class="who"><div class="hdr-btns">
        <span class="dlgc" title="Dialog windows open">🗗 2 <small>dialogs</small></span>
        <span class="hb" title="Calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="nb">3</span></span>
        <span class="hb" title="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="nb amber">2</span></span>
      </div><div><div class="t">7:03 pm IST</div><div class="d">Tuesday, 20th October 2026</div></div><div class="avatar">M</div></div>
  </header>
  <section class="tips" id="tips">
    <span class="lbl">💡 Tips</span>
    <div class="win"><div class="track" id="tipTrack"></div></div>

    <div class="te-add"><div class="txt">Type a new tip… e.g. "Seminar Fri 30 Oct, Hall B 10 am"</div><span class="sel">● Work</span><span class="btn" style="padding:7px 14px;background:var(--amber)">Add tip</span></div>
    <div class="te-foot"><span>Scroll every <b>5 s ▾</b></span><span>☑ Pause when the mouse is over it</span><span>☑ Add upcoming events automatically</span><span class="btn">Done</span></div></div>`);
  document.getElementById("tipEditBtn").classList.add("hint");
  document.getElementById("tipEditBtn").style.setProperty("--pc", "var(--amber)");
}
</script>
